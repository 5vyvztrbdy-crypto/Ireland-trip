<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RavensCircle.app">
<title>RavensCircle.app — Joyce Journey</title>
<style>
:root{--green:#123d31;--green2:#1d5b49;--cream:#f6f2e8;--gold:#d7ad55;--ink:#18201d;--muted:#64706b;--card:#fff;--danger:#8d2d20}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--cream);color:var(--ink)}
button,a{font:inherit}.splash{position:fixed;inset:0;z-index:99;background:linear-gradient(160deg,#0e3027,#1d5b49);color:white;display:grid;place-content:center;text-align:center;padding:32px}
.splash.hide{display:none}.mark{font-size:50px;color:var(--gold)}.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:800;opacity:.8}
.splash h1{font-family:Georgia,serif;font-size:44px;margin:8px}.splash-journey{font-size:13px;letter-spacing:.16em;font-weight:800;color:#f0cf83;margin:2px 0 18px}.tag{font-family:Georgia,serif;font-size:20px;line-height:1.45;max-width:420px}
.primary,.secondary,.ghost{border:0;border-radius:14px;padding:12px 15px;font-weight:750;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.primary{background:var(--green);color:white}.splash .primary{background:var(--gold);color:#18342d;margin-top:18px}.secondary{background:#e7eee9;color:var(--green)}.ghost{background:transparent;color:var(--green);border:1px solid #c8d4ce}
header{background:var(--green);color:white;padding:16px 18px;position:sticky;top:0;z-index:10}header h1{font-family:Georgia,serif;margin:1px 0;font-size:25px}.journey-name{font-size:12px;letter-spacing:.08em;opacity:.78}
.header-inner{max-width:760px;margin:auto;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.next-reservation{display:none;max-width:230px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 10px;color:white}.next-reservation.visible{display:block}.next-reservation .eyebrow{color:#f0cf83}.next-reservation strong,.next-reservation span{display:block}.next-reservation strong{font-size:13px}.next-reservation span{font-size:12px;margin-top:2px}.next-reservation a{color:white;font-size:12px;font-weight:750}
.alert{margin:14px;background:#fff3d6;border-left:5px solid #d09324;padding:13px;border-radius:10px;font-size:14px}.alert:empty{display:none}
nav{display:flex;overflow:auto;gap:7px;padding:10px 12px;background:#f9f7f1;position:sticky;top:82px;z-index:9;border-bottom:1px solid #ddd}
nav button{white-space:nowrap;border:0;background:#e8ebe7;padding:9px 12px;border-radius:999px;font-weight:700}nav button.active{background:var(--green);color:white}
main{max-width:760px;margin:auto;padding:12px 12px 110px}.view{display:none}.view.active{display:block}
.hero{background:linear-gradient(135deg,var(--green),var(--green2));color:white;border-radius:22px;padding:22px;margin:4px 0 14px}.hero h2{font-family:Georgia,serif;font-size:28px;margin:4px 0}.hero p{opacity:.9}
.card{background:var(--card);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 14px rgba(0,0,0,.06)}.card h3{margin:0 0 7px}.muted{color:var(--muted);font-size:14px}
.day-btn{width:100%;text-align:left;background:white;border:0;border-radius:16px;padding:16px;margin:8px 0;box-shadow:0 2px 10px rgba(0,0,0,.05)}.day-btn strong{display:block;font-size:17px}.day-btn span{color:var(--muted)}
.stop{display:grid;grid-template-columns:35px 1fr;gap:10px}.num{width:30px;height:30px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}.chip{background:#eef2ef;border-radius:99px;padding:5px 8px;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.restaurant{border-top:1px solid #e4e5e2;padding:12px 0}.restaurant:first-of-type{border-top:0}.restaurant b{display:block}
textarea,input,select{width:100%;border:1px solid #ccd3cf;border-radius:12px;padding:11px;background:white;font:inherit;margin:5px 0 11px}
.rating button{font-size:27px;border:0;background:none;padding:2px}.pause{background:#e9f2ee;border:2px solid #b8d2c6;text-align:center}.pause h3{font-family:Georgia,serif;font-size:23px}
.utility-actions{position:fixed;right:16px;bottom:16px;z-index:8;display:flex;gap:6px;padding:6px;background:rgba(246,242,232,.94);border:1px solid #d8ddd9;border-radius:99px;box-shadow:0 3px 14px rgba(0,0,0,.12)}.fab{background:transparent;color:var(--green);border:0;border-radius:99px;padding:8px 10px;font-size:12px;font-weight:750}.fab:hover,.fab:focus-visible{background:#e3ebe6}.home-paths{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}.home-path{min-height:132px;border:0;border-radius:20px;padding:20px;text-align:left;color:white;background:linear-gradient(145deg,var(--green),var(--green2));box-shadow:0 5px 18px rgba(18,61,49,.18);cursor:pointer}.home-path.memory{background:linear-gradient(145deg,#273d37,#49655d)}.home-path .eyebrow{color:#f0cf83;margin-bottom:24px}.home-path strong{display:block;font-family:Georgia,serif;font-size:24px}.home-path span{display:block;margin-top:5px;font-size:13px;opacity:.8}.home-context{min-height:168px;padding:24px}.home-secondary{font-size:14px}@media(max-width:620px){header h1{font-size:21px}.journey-name{font-size:11px}.next-reservation{max-width:175px}.next-reservation span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.home-paths{gap:8px}.home-path{min-height:118px;padding:15px}.home-path .eyebrow{margin-bottom:18px}.home-path strong{font-size:19px}.utility-actions{right:10px;bottom:10px;left:10px;justify-content:center}.fab{padding:8px;font-size:11px}}
dialog{border:0;border-radius:20px;width:min(92%,600px);padding:20px}dialog::backdrop{background:rgba(0,0,0,.55)}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}
small{color:var(--muted)}.danger{color:var(--danger);font-weight:800}
</style>
</head>
<body>
<div id="splash" class="splash">
  <div class="mark">✦</div><div class="eyebrow">THE FIRST STORIED JOURNEY</div>
  <h1>RavensCircle.app</h1>
  <div class="splash-journey">JOYCE JOURNEY</div>
  <div class="tag">Every journey deserves an epic plan and an unforgettable story.</div>
  <button id="startApp" class="primary">Begin Your Journey</button>
</div>
<header><div class="header-inner"><div><div class="eyebrow">RAVENSCIRCLE.APP</div><h1>Joyce Journey</h1><div class="journey-name">ICELAND + IRELAND · 2026</div></div><aside id="nextReservation" class="next-reservation" aria-live="polite"></aside></div></header>
<div id="notices" class="alert"></div>
<nav id="nav">
<button class="active" data-v="today">Home</button><button data-v="journey">Journey</button><button data-v="reservations">Reservations</button><button data-v="journal">Memories</button><button data-v="heritage">Heritage</button>
</nav>
<main>
<section id="today" class="view active"><div class="card">Loading journey…</div></section>
<section id="journey" class="view"></section>
<section id="reservations" class="view"></section>
<section id="journal" class="view"></section>
<section id="heritage" class="view"></section>
</main>
<div class="utility-actions" aria-label="Journey tools">
  <button id="surpriseButton" class="fab">✦ Surprise</button>
  <button id="campfireButton" class="fab">🔥 Campfire Captures</button>
  <button id="pauseButton" class="fab">⏸ Pause</button>
</div>
<dialog id="dlg"><button id="closeDialog" class="close" aria-label="Close">×</button><div id="dlgBody"></div></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
